local_backend: true

backend:
  name: git-gateway
  branch: main

# Media files will be stored here
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Site URL for previews
site_url: https://adorable-malabi-5f0452.netlify.app
display_url: https://adorable-malabi-5f0452.netlify.app

# ============================================
# CONTENT COLLECTIONS
# ============================================
collections:
  # --------------------------------------------
  # COLLEGES (folder-based, multiple files)
  # --------------------------------------------
  - name: "colleges"
    label: "🏫 Colleges"
    label_singular: "College"
    description: "Manage partner colleges and their details"
    folder: "src/data/colleges"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "College Name", name: "name", widget: "string" }
      - { label: "Short Name", name: "shortName", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - label: "Location"
        name: "location"
        widget: "object"
        fields:
          - { label: "City", name: "city", widget: "string" }
          - { label: "State", name: "state", widget: "string", default: "Karnataka" }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Private", "Deemed", "Government", "Autonomous"]
      - { label: "Established Year", name: "established", widget: "number", value_type: "int" }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 0, max: 5 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "Courses"
        name: "courses"
        widget: "list"
        fields:
          - { label: "Course Name", name: "name", widget: "string" }
          - { label: "Duration", name: "duration", widget: "string" }
          - { label: "Total Fees", name: "fees", widget: "number" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }

  # --------------------------------------------
  # TESTIMONIALS (single file with files array)
  # --------------------------------------------
  - name: "testimonials"
    label: "💬 Testimonials"
    description: "Manage testimonials from parents, students, and institutions"
    files:
      - label: "All Testimonials"
        name: "testimonials"
        file: "src/data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Institution", name: "institution", widget: "string", required: false }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["institution", "parent", "student"]
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }

  # --------------------------------------------
  # PARTNER INSTITUTIONS (single file with files array)
  # --------------------------------------------
  - name: "partners"
    label: "🤝 Partners"
    description: "Manage partner institutions displayed on the website"
    files:
      - label: "All Partners"
        name: "partners"
        file: "src/data/partners.json"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["school", "college"]
              - { label: "City", name: "city", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Website", name: "website", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
          - label: "Stats"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Total Partners", name: "total_partners", widget: "number" }
              - { label: "Schools", name: "schools", widget: "number" }
              - { label: "Colleges", name: "colleges", widget: "number" }
              - { label: "Cities", name: "cities", widget: "number" }

  # --------------------------------------------
  # STATISTICS (single file with files array)
  # --------------------------------------------
  - name: "stats"
    label: "📊 Statistics"
    description: "Update numbers shown on the website"
    files:
      - label: "Site Statistics"
        name: "stats"
        file: "src/data/stats.json"
        fields:
          - label: "Homepage Stats"
            name: "homepage_stats"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Description", name: "description", widget: "string", required: false }
          - label: "Institution Stats"
            name: "institution_stats"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Description", name: "description", widget: "string", required: false }

  # --------------------------------------------
  # BLOG POSTS (folder-based, multiple files)
  # --------------------------------------------
  - name: "blog"
    label: "📝 Blog Posts"
    label_singular: "Post"
    description: "Write and manage blog articles"
    folder: "src/data/post"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Ace-Scholara Team" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - label: "Tags"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # --------------------------------------------
  # SITE SETTINGS (single file with files array)
  # --------------------------------------------
  - name: "settings"
    label: "⚙️ Site Settings"
    description: "Global site configuration"
    files:
      - label: "Site Configuration"
        name: "site"
        file: "src/config/site.yaml"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
          - label: "Social Media"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Twitter", name: "twitter", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }