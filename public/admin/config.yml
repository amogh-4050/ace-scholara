backend:
  name: git-gateway
  branch: main

# Media files will be stored here
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Site URL for previews
site_url: https://adorable-malabi-5f0452.netlify.app
display_url: https://adorable-malabi-5f0452.netlify.app

# Logo in admin panel
logo_url: /images/logo.png

# Slug settings
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ============================================
# CONTENT COLLECTIONS
# ============================================
collections:
  # --------------------------------------------
  # COLLEGES
  # --------------------------------------------
  - name: "colleges"
    label: "🏫 Colleges"
    label_singular: "College"
    description: "Manage partner colleges and their details"
    folder: "src/data/colleges"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} - {{location.city}}"
    fields:
      - { label: "College Name", name: "name", widget: "string", hint: "Full name of the college" }
      - { label: "Short Name", name: "shortName", widget: "string", hint: "Abbreviated name (e.g., MIT, RVCE)" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly name (e.g., mit-manipal)" }
      - label: "Location"
        name: "location"
        widget: "object"
        fields:
          - { label: "City", name: "city", widget: "string" }
          - { label: "State", name: "state", widget: "string", default: "Karnataka" }
          - { label: "Address", name: "address", widget: "string", required: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Private", "Deemed", "Government", "Autonomous"]
      - { label: "Established Year", name: "established", widget: "number", value_type: "int", min: 1900, max: 2025 }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.1 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show on homepage?" }
      - label: "Accreditation"
        name: "accreditation"
        widget: "list"
        field: { label: "Accreditation", name: "accreditation", widget: "string" }
        hint: "e.g., NAAC A++, NBA, AICTE"
      - label: "Ranking"
        name: "ranking"
        widget: "object"
        fields:
          - { label: "NIRF Rank", name: "nirf", widget: "number", required: false }
          - { label: "Category", name: "category", widget: "string", required: false }
      - label: "Courses"
        name: "courses"
        widget: "list"
        summary: "{{fields.name}} - ₹{{fields.fees}}"
        fields:
          - { label: "Course Name", name: "name", widget: "string" }
          - { label: "Duration", name: "duration", widget: "string", hint: "e.g., 4 years" }
          - { label: "Total Fees (₹)", name: "fees", widget: "number" }
          - { label: "Seats", name: "seats", widget: "number", required: false }
      - label: "Placement Stats"
        name: "placementStats"
        widget: "object"
        fields:
          - { label: "Average Package (LPA)", name: "averagePackage", widget: "number", value_type: "float" }
          - { label: "Highest Package (LPA)", name: "highestPackage", widget: "number", value_type: "float" }
          - { label: "Placement Rate (%)", name: "placementRate", widget: "number", min: 0, max: 100 }
      - label: "Facilities"
        name: "facilities"
        widget: "list"
        field: { label: "Facility", name: "facility", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Logo", name: "logo", widget: "image", required: false }

  # --------------------------------------------
  # TESTIMONIALS
  # --------------------------------------------
  - name: "testimonials"
    label: "💬 Testimonials"
    label_singular: "Testimonial"
    description: "Manage testimonials from parents, students, and institutions"
    file: "src/data/testimonials.json"
    fields:
      - label: "Testimonials"
        name: "testimonials"
        widget: "list"
        summary: "{{fields.name}} - {{fields.type}}"
        fields:
          - { label: "ID", name: "id", widget: "number", value_type: "int" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string", hint: "e.g., Parent, Director, Student" }
          - { label: "Institution", name: "institution", widget: "string", required: false }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "Institution", value: "institution" }
              - { label: "Parent", value: "parent" }
              - { label: "Student", value: "student" }
          - { label: "Quote", name: "quote", widget: "text" }
          - { label: "Photo", name: "image", widget: "image", required: false }
          - { label: "Featured", name: "featured", widget: "boolean", default: false }

  # --------------------------------------------
  # PARTNER INSTITUTIONS
  # --------------------------------------------
  - name: "partners"
    label: "🤝 Partners"
    label_singular: "Partner"
    description: "Manage partner institutions displayed on the website"
    file: "src/data/partners.json"
    fields:
      - label: "Partners"
        name: "partners"
        widget: "list"
        summary: "{{fields.name}} - {{fields.city}}"
        fields:
          - { label: "ID", name: "id", widget: "number", value_type: "int" }
          - { label: "Name", name: "name", widget: "string" }
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - { label: "School", value: "school" }
              - { label: "College", value: "college" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Website", name: "website", widget: "string", required: false }
          - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "Stats"
        name: "stats"
        widget: "object"
        fields:
          - { label: "Total Partners", name: "total_partners", widget: "number" }
          - { label: "Schools", name: "schools", widget: "number" }
          - { label: "Colleges", name: "colleges", widget: "number" }
          - { label: "Cities", name: "cities", widget: "number" }

  # --------------------------------------------
  # STATISTICS
  # --------------------------------------------
  - name: "stats"
    label: "📊 Statistics"
    description: "Update numbers shown on the website"
    file: "src/data/stats.json"
    fields:
      - label: "Homepage Stats"
        name: "homepage_stats"
        widget: "list"
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string", hint: "e.g., 50+, 98%, 10K+" }
          - { label: "Description", name: "description", widget: "string", required: false }
      - label: "Institution Stats"
        name: "institution_stats"
        widget: "list"
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
      - label: "Market Stats"
        name: "market_stats"
        widget: "object"
        fields:
          - { label: "International Schools (South India)", name: "international_schools_south_india", widget: "string" }
          - { label: "Private Colleges (South India)", name: "private_colleges_south_india", widget: "string" }
          - { label: "Annual Admissions Market", name: "annual_admissions_market", widget: "string" }

  # --------------------------------------------
  # BLOG POSTS
  # --------------------------------------------
  - name: "blog"
    label: "📝 Blog Posts"
    label_singular: "Post"
    description: "Write and manage blog articles"
    folder: "src/data/post"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly title" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Ace-Scholara Team" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short description for previews" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - label: "Tags"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Content", name: "body", widget: "markdown" }

  # --------------------------------------------
  # SITE SETTINGS
  # --------------------------------------------
  - name: "settings"
    label: "⚙️ Site Settings"
    description: "Global site configuration"
    file: "src/config/site.yaml"
    fields:
      - label: "Site"
        name: "site"
        widget: "object"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Contact"
        name: "contact"
        widget: "object"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
      - label: "Social Media"
        name: "social"
        widget: "object"
        fields:
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
          - { label: "Twitter", name: "twitter", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
